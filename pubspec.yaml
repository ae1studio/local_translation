name: local_translation
description: On-device translation and language detection for Flutter.
version: 0.1.0
homepage: https://github.com/ae1studio/local_translation

environment:
  sdk: ^3.13.0
  flutter: ">=3.7.0"

platforms:
  android:
  ios:
  macos:

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^27.3.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.ae1.local_translation
        pluginClass: LocalTranslationPlugin
      ios:
        pluginClass: LocalTranslationPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: LocalTranslationPlugin
        sharedDarwinSource: true
