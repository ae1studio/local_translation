name: local_translation
description: On-device translation and language detection for Flutter.
version: 0.0.1
homepage: https://github.com/ae1studio/local_translation

environment:
  sdk: ^3.13.0
  flutter: ">=3.3.0"

platforms:
  ios:

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^27.3.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: LocalTranslationPlugin
